[pytest]
addopts = -q --cov=kashat --cov-report=term-missing --cov-fail-under=50
pythonpath = apps/backend/src
asyncio_mode = auto
filterwarnings =
    ignore:'crypt' is deprecated.*:DeprecationWarning:passlib.utils
    ignore:datetime\.datetime\.utcnow\(\) is deprecated.*:DeprecationWarning:jose.jwt
testpaths =
    apps/backend/tests
