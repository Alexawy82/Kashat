# LedgerLoop CoreLab Production Deployment
# Target: lab-core.local home server
# Usage: docker compose -f docker-compose.corelab.yml up -d

version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ledgerloop-backend
    restart: always
    environment:
      # Security - use .env.corelab for secrets
      - LEDGERLOOP_JWT_SECRET=${LEDGERLOOP_JWT_SECRET}
      # Admin endpoints are currently unauthenticated; rely on network isolation.

      # CORS - CoreLab specific origins
      - LEDGERLOOP_CORS=http://ledgerloop.lab-core.local,http://lab-core.local:3000,http://localhost:3000

      # Database
      - LEDGERLOOP_DATA_DIR=/data
      - LEDGERLOOP_ENV=production
      - LEDGERLOOP_LOG_LEVEL=INFO

      # AI Configuration - LMStudio on CoreLab
      - LEDGERLOOP_DISABLE_REALTIME=false
      - LEDGERLOOP_AI_PROVIDER=lmstudio
      - LEDGERLOOP_AI_LMSTUDIO_BASE_URL=http://host.docker.internal:1234/v1
      - LEDGERLOOP_AI_MODEL_CATEGORIZE=qwen/qwen3-4b-2507
      - LEDGERLOOP_AI_MODEL_MERCHANT=qwen/qwen3-4b-2507
      - LEDGERLOOP_AI_MODEL_ANOMALY=qwen/qwen3-4b-2507

      # Single-user mode
      - LEDGERLOOP_ALLOW_REGISTRATION=false

      # Rate limiting
      - LEDGERLOOP_RATE_LIMIT=100/minute

    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${LL_BIND_IP:-0.0.0.0}:${BACKEND_PORT:-8000}:8000"
    volumes:
      - /opt/ledgerloop/data:/data
      - /opt/ledgerloop/backups:/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ledgerloop-net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        - NEXT_PUBLIC_API_BASE=/api
        - LEDGERLOOP_BACKEND_ORIGIN=http://backend:8000
    container_name: ledgerloop-web
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE:-/api}
      - NEXT_PUBLIC_ENABLE_REALTIME=1
    ports:
      - "${LL_BIND_IP:-0.0.0.0}:${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - ledgerloop-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

networks:
  ledgerloop-net:
    driver: bridge
