# Kashat Production Docker Compose
# Usage: docker compose up -d
#
# Notes:
# - Authentication is currently disabled in the backend; treat this as a single-user app.
# - Do not expose these ports to untrusted networks; prefer binding to localhost.
# - Use KASHAT_BIND_IP to control host bind address (e.g. 127.0.0.1 or 0.0.0.0).

version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: kashat-backend
    restart: unless-stopped
    environment:
      # Security (auth disabled; kept for compatibility with legacy endpoints)
      - KASHAT_JWT_SECRET=${KASHAT_JWT_SECRET:-kashat-dev-secret-change-in-production}

      # CORS - allow localhost on any port for development
      - KASHAT_CORS=${KASHAT_CORS:-*}

      # Database
      - KASHAT_DATA_DIR=/data
      - KASHAT_ENV=production
      - KASHAT_LOG_LEVEL=${KASHAT_LOG_LEVEL:-INFO}

      # AI Configuration
      - KASHAT_DISABLE_REALTIME=${KASHAT_DISABLE_REALTIME:-true}
      - KASHAT_AI_PROVIDER=${KASHAT_AI_PROVIDER:-lmstudio}
      - KASHAT_AI_LMSTUDIO_BASE_URL=${KASHAT_AI_LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      - KASHAT_AI_MODEL_CATEGORIZE=${KASHAT_AI_MODEL_CATEGORIZE:-qwen/qwen3-4b-2507}
      - KASHAT_AI_MODEL_MERCHANT=${KASHAT_AI_MODEL_MERCHANT:-qwen/qwen3-4b-2507}
      - KASHAT_AI_MODEL_ANOMALY=${KASHAT_AI_MODEL_ANOMALY:-qwen/qwen3-4b-2507}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

      # User Registration
      - KASHAT_ALLOW_REGISTRATION=${KASHAT_ALLOW_REGISTRATION:-false}

      # Rate limiting
      - KASHAT_RATE_LIMIT=${KASHAT_RATE_LIMIT:-100/minute}

    extra_hosts:
      # Allow reaching services running on the Docker host (e.g. LMStudio) on Linux as well.
      - "host.docker.internal:host-gateway"
    ports:
      - "${KASHAT_BIND_IP:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    volumes:
      - kashat-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - kashat-net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        - NEXT_PUBLIC_API_BASE=/api
        - KASHAT_BACKEND_ORIGIN=http://backend:8000
    container_name: kashat-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # Client should use same-origin '/api' and let Next proxy to the backend origin.
      - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE:-/api}
      - NEXT_PUBLIC_ENABLE_REALTIME=${NEXT_PUBLIC_ENABLE_REALTIME:-0}
    ports:
      - "${KASHAT_BIND_IP:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - kashat-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

networks:
  kashat-net:
    driver: bridge

volumes:
  kashat-data:
    driver: local
